[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-intelligence-core"
version = "0.1.0"
description = "Retail Demand Forecasting & Fraud Simulation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "fastparquet>=2023.10.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "joblib>=1.3.0",
    "prophet>=1.1.5",
    "torch>=2.1.0",
    "shap>=0.44.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "streamlit>=1.29.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
